<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#24352a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Revier">
  <title>Revier</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map"></div>

  <!-- Statuszeile: GPS-Genauigkeit, aktuelles Revier, offline -->
  <div id="statusbar" hidden></div>

  <!-- Kompass: halbrunde Gradskala am unteren Rand (wird in js/compass.js gezeichnet) -->
  <div id="compass-dial" hidden aria-live="off"></div>

  <!-- Fadenkreuz für den Platzier-Modus -->
  <div id="crosshair" hidden></div>

  <!-- Schwebende Knöpfe rechts -->
  <div id="fabs">
    <button id="btn-compass" class="fab" title="Kompass" aria-label="Kompass">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4l3 8h-6z" fill="#d32f2f"/><path d="M12 20l-3-8h6z" fill="currentColor"/></svg>
    </button>
    <button id="btn-locate" class="fab" title="GPS einschalten" aria-label="Meine Position">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="btn-add" class="fab primary" title="Neu" aria-label="Neu anlegen">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="addmenu" hidden>
    <button class="btn" data-act="add-ev">Ereignis (Sichtung, Abschuss …)</button>
    <button class="btn" data-act="add-ei">Einrichtung (Hochsitz, Kirrung …)</button>
    <button class="btn" data-act="add-rv">Revier zeichnen</button>
  </div>

  <!-- Werkzeugleiste beim Zeichnen einer Reviergrenze -->
  <div id="drawbar" class="toolbar" hidden>
    <div class="toolbar-info"><b id="draw-count">0 Punkte</b> <span id="draw-hint"></span></div>
    <div class="toolbar-btns">
      <button id="draw-undo" class="btn">↶ Zurück</button>
      <button id="draw-gps" class="btn">GPS-Punkt</button>
      <button id="draw-del" class="btn" disabled>Punkt löschen</button>
      <button id="draw-cancel" class="btn">Abbrechen</button>
      <button id="draw-done" class="btn primary" disabled>Fertig</button>
    </div>
  </div>

  <!-- Werkzeugleiste beim Platzieren eines Punktes -->
  <div id="placebar" class="toolbar" hidden>
    <div class="toolbar-info" id="place-label"></div>
    <div class="toolbar-btns">
      <button id="place-cancel" class="btn">Abbrechen</button>
      <button id="place-me" class="btn">Meine Position</button>
      <button id="place-here" class="btn primary">Hier (Fadenkreuz)</button>
    </div>
  </div>

  <!-- Listen: unten als Sheet (Handy), rechts als Seitenleiste (PC) -->
  <section id="sheet" hidden>
    <header><h2 id="sheet-title"></h2><button id="sheet-close" class="btn sm" aria-label="Schließen">✕</button></header>
    <div id="sheet-body"></div>
  </section>

  <nav id="tabs">
    <button data-tab="map" class="active">Karte</button>
    <button data-tab="reviere">Reviere</button>
    <button data-tab="ereignisse">Ereignisse</button>
    <button data-tab="mehr">Mehr</button>
  </nav>

  <dialog id="dlg"></dialog>
  <dialog id="dlg2"></dialog>
  <div id="toast"></div>
  <input type="file" id="file-input" hidden>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
